
name: Update Activity Chart

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-chart
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution charts
        uses: dturovskiy/deus-commit-chart@v1.5.3
        with:
          username: sourabhvamdevan
          token: ${{ secrets.DEUS_COMMIT_CHART_TOKEN || github.token }}
          default-days: "30"
          ranges: "30,90,365"
          layout: spacious
          output-dir: activity-dist

      - name: Publish charts
        env:
          TARGET_BRANCH: activity-assets
        run: |
          set -euo pipefail

          temp_dir="$(mktemp -d)"
          cp -a activity-dist/. "$temp_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan "$TARGET_BRANCH"

          find . -mindepth 1 -maxdepth 1 ! -name .git \
            -exec rm -rf {} +

          cp -a "$temp_dir"/. .
          git add -A

          if git diff --cached --quiet; then
            echo "No chart changes to publish."
            exit 0
          fi

          git commit -m "chore: refresh activity charts"
          git push --force origin "$TARGET_BRANCH"

